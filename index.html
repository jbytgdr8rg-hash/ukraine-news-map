<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ukraine Situation Map | 最新ニュース地図</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#e9eef7;background:#0c1422}*{box-sizing:border-box}body{margin:0}header{padding:19px 26px;background:#101c2d;border-bottom:1px solid #28374a;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:21px;margin:0;letter-spacing:.02em}header p{color:#94a7bc;font-size:12px;margin:6px 0 0}.pill{font-size:12px;background:#173c3b;color:#9ee8d4;padding:8px 12px;border-radius:30px}.layout{display:grid;grid-template-columns:minmax(320px,1fr) 390px;height:calc(100vh - 88px);min-height:550px}#map{height:100%;background:#152334}.panel{overflow:auto;border-left:1px solid #293a4d;background:#0e1929}.toolbar{position:sticky;top:0;background:#0e1929;padding:17px 17px 12px;border-bottom:1px solid #2a3a4c;z-index:10}.toolbar h2{margin:0 0 8px;font-size:15px}.toolbar small{color:#93a6bc}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.filters button{background:#18283c;color:#b9cbe0;border:1px solid #31445b;border-radius:16px;padding:6px 10px;cursor:pointer;font-size:12px}.filters button.active{background:#dce8f6;color:#14263a}.news{padding:15px 17px;border-bottom:1px solid #26364a;cursor:pointer}.news:hover,.news.selected{background:#17283c}.news .meta{color:#8ca4be;font-size:11px;margin-bottom:7px}.news h3{font-size:15px;line-height:1.5;margin:0 0 8px}.news p{color:#b5c3d4;font-size:12px;line-height:1.7;margin:0 0 9px}.news a{color:#8fc9ff;font-size:12px;text-decoration:none}.news a:hover{text-decoration:underline}.tag{display:inline-block;border:1px solid #47617a;border-radius:4px;padding:2px 5px;margin-right:6px}.legend{position:absolute;bottom:20px;left:15px;z-index:500;background:#111e30ed;color:#d4e3f5;border:1px solid #3c526a;padding:12px;border-radius:10px;font-size:12px;max-width:270px}.legend div{margin-top:6px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#142339;color:#eef4ff}.leaflet-popup-content a{color:#7bc8ff}.foot{padding:13px 17px;font-size:11px;line-height:1.6;color:#8399b2}@media(max-width:800px){.layout{display:flex;flex-direction:column;height:auto}#map{height:55vh;min-height:350px}.panel{height:auto;max-height:none}.legend{display:none}}
</style></head><body><header><div><h1>UKRAINE / SITUATION MAP</h1><p>ウクライナ関連ニュースを地理的に把握する・地図上の位置は概略</p></div><span class="pill" id="updated">データ読込中</span></header><div class="layout"><div style="position:relative"><div id="map"></div><div class="legend"><b>ニュース分類</b><div><span class="dot" style="background:#f08c72"></span>攻撃・軍事</div><div><span class="dot" style="background:#e7bc66"></span>国境・NATO</div><div><span class="dot" style="background:#75bde7"></span>外交・政策</div><div style="color:#8fa3bb;margin-top:9px">ピンは都市・地域の代表点。攻撃地点の正確な座標ではありません。</div></div></div><aside class="panel"><div class="toolbar"><h2>最新トピック <span id="count"></span></h2><small>記事を選ぶと地図が移動します。リンクから原文を確認できます。</small><div class="filters"><button class="active" data-filter="all">すべて</button><button data-filter="military">攻撃・軍事</button><button data-filter="nato">国境・NATO</button><button data-filter="diplomacy">外交・政策</button></div></div><div id="feed"></div><div class="foot">報道に基づく位置推定であり、リアルタイムの軍事情報や攻撃予測ではありません。自動収集記事は誤分類や重複があり得ます。必ず原文で確認してください。</div></aside></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([49.3,31.2],5);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',maxZoom:18}).addTo(map);
const colors={military:'#f08c72',nato:'#e7bc66',diplomacy:'#75bde7'};let items=[],markers=[],selected=null,filter='all';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const subset=items.filter(x=>filter==='all'||x.category===filter);document.getElementById('count').textContent=`(${subset.length}件)`;document.getElementById('feed').innerHTML=subset.map((x,i)=>`<article class="news ${selected===x.id?'selected':''}" data-id="${esc(x.id)}"><div class="meta"><span class="tag">${esc(x.place)}</span>${esc(x.date)} · ${esc(x.source)}</div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">ニュース原文を読む ↗</a></article>`).join('')||'<div class="foot">該当記事はありません。</div>';subset.forEach(x=>{let marker=L.circleMarker([x.lat,x.lon],{radius:8,color:'#0b1420',weight:2,fillColor:colors[x.category]||'#aaa',fillOpacity:.94}).addTo(map);marker.bindPopup(`<b>${esc(x.title)}</b><p>${esc(x.summary)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">出典を見る ↗</a>`);marker.on('click',()=>select(x.id,false));markers.push(marker)});document.querySelectorAll('.news').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('a'))return;select(el.dataset.id,true)}))}function select(id,fly){selected=id;let x=items.find(v=>v.id===id);if(!x)return;document.querySelectorAll('.news').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));if(fly){map.flyTo([x.lat,x.lon],Math.max(map.getZoom(),7),{duration:.7});let idx=items.filter(y=>filter==='all'||y.category===filter).findIndex(y=>y.id===id);if(markers[idx])markers[idx].openPopup()}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(c=>c.classList.toggle('active',c===b));render()});fetch('./data.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{items=d.items||[];document.getElementById('updated').textContent='最終更新 '+(d.updated_at||'不明').replace('T',' ').slice(0,16)+' UTC';render()}).catch(e=>{document.getElementById('updated').textContent='データ取得失敗';document.getElementById('feed').textContent='data.json を読み込めません。Webサーバーで開いてください。 '+e.message});
</script></body></html>
